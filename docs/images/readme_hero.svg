      <rect y="150" width="142" height="78" rx="18" fill="#102747" stroke="#718BFF" stroke-opacity="0.48"/>
      <circle cx="71" cy="33" r="17" stroke="#9DB1FF" stroke-width="3"/>
      <path d="M53 57C61 47 81 47 89 57M61 32H81M67 40H75" stroke="#9DB1FF" stroke-width="3" stroke-linecap="round"/>
      <text x="71" y="69" fill="#D9E0FF" font-size="14" font-weight="650" text-anchor="middle">FACE FRAMES</text>

      <path d="M158 39H226M206 29L226 39L206 49" stroke="#5F83B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M158 189H186C209 189 205 123 226 123" stroke="#5F83B7" stroke-width="3" stroke-linecap="round"/>

      <rect x="236" y="53" width="166" height="138" rx="24" fill="url(#accent)" fill-opacity="0.16" stroke="#71A6FF" stroke-opacity="0.62"/>
      <circle cx="319" cy="103" r="26" fill="#65E4FF" fill-opacity="0.16" stroke="#65E4FF" stroke-width="2"/>
      <path d="M309 103H329M319 93V113" stroke="#65E4FF" stroke-width="4" stroke-linecap="round"/>
      <text x="319" y="151" fill="#FFFFFF" font-size="18" font-weight="750" text-anchor="middle">ALIGN &amp; FUSE</text>
      <text x="319" y="174" fill="#9FB7DB" font-size="13" text-anchor="middle">confidence-aware</text>

      <path d="M418 122H466M446 112L466 122L446 132" stroke="#5F83B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(478 16)">
        <rect width="120" height="60" rx="16" fill="#122C50" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="60" y="27" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">SCORE</text>
        <text x="60" y="46" fill="#70DBFF" font-size="13" text-anchor="middle">0 – 10</text>
        <rect y="91" width="120" height="60" rx="16" fill="#122C50" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="60" y="118" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">FEEDBACK</text>
        <text x="60" y="137" fill="#AABFFF" font-size="13" text-anchor="middle">GPT + TTS</text>
        <rect y="182" width="120" height="60" rx="16" fill="#122C50" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="60" y="209" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">DIAGNOSIS</text>
        <text x="60" y="228" fill="#AABFFF" font-size="13" text-anchor="middle">A/V consistency</text>
