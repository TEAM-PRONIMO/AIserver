<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pronimo AI Server</title>
  <desc id="desc">Audio and visual pronunciation analysis pipeline</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1510" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071327"/>
      <stop offset="0.58" stop-color="#102A56"/>
      <stop offset="1" stop-color="#193A73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65E4FF"/>
      <stop offset="1" stop-color="#718BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 265) rotate(90) scale(380)">
      <stop stop-color="#4F7CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020713" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#CDE4FF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="620" rx="34" fill="url(#glow)"/>

  <g opacity="0.72">
    <circle cx="1478" cy="85" r="5" fill="#65E4FF"/>
    <circle cx="1435" cy="119" r="2.5" fill="#FFFFFF"/>
    <circle cx="1522" cy="165" r="3" fill="#8BA4FF"/>
    <circle cx="116" cy="514" r="4" fill="#65E4FF"/>
    <circle cx="173" cy="548" r="2.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(110 94)">
    <rect width="214" height="40" rx="20" fill="#65E4FF" fill-opacity="0.12" stroke="#65E4FF" stroke-opacity="0.46"/>
    <circle cx="25" cy="20" r="6" fill="#65E4FF"/>
    <text x="43" y="26" fill="#BEEFFF" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">AI ENGINEERING</text>

    <text x="0" y="132" fill="#FFFFFF" font-family="Inter, Pretendard, Arial, sans-serif" font-size="73" font-weight="800" letter-spacing="-2">Pronimo</text>
    <text x="0" y="196" fill="url(#accent)" font-family="Inter, Pretendard, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="1">AI Server</text>

    <text x="0" y="254" fill="#D7E5FF" font-family="Inter, Pretendard, Arial, sans-serif" font-size="24" font-weight="500">Audio × Visual Pronunciation Intelligence</text>
    <text x="0" y="296" fill="#9DB2D7" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19">음성·입모양을 함께 이해하는 멀티모달 발음 분석 엔진</text>

    <g transform="translate(0 348)" font-family="Inter, Pretendard, Arial, sans-serif" font-size="16" font-weight="650">
      <rect width="116" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="26" y="27" fill="#DDE9FF">Speech</text>
      <rect x="130" width="104" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="154" y="27" fill="#DDE9FF">Vision</text>
      <rect x="248" width="116" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="270" y="27" fill="#DDE9FF">Fusion</text>
      <rect x="378" width="136" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="400" y="27" fill="#DDE9FF">Feedback</text>
    </g>
