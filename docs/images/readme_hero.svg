      <rect width="142" height="78" rx="18" fill="#102747" stroke="#65E4FF" stroke-opacity="0.42"/>
      <path d="M24 43C33 43 33 27 42 27C51 27 51 53 60 53C69 53 69 22 78 22C87 22 87 47 96 47C105 47 105 34 114 34" stroke="#65E4FF" stroke-width="4" stroke-linecap="round"/>
